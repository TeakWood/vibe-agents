[project]
name = "vibe-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anyio",
    "claude-agent-sdk",
]

[project.scripts]
install-plugins = "scripts.install_plugins:main"
vibe-agents = "vibe_agents.sthapathi:main"

[tool.setuptools.packages.find]
include = ["scripts*", "vibe_agents*"]

[tool.uv]
package = true
