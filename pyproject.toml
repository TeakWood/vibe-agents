[project]
name = "shreni"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anyio",
    "claude-agent-sdk",
]

[project.scripts]
install-plugins = "scripts.install_plugins:main"
shreni = "shreni.sthapathi:main"

[tool.setuptools.packages.find]
include = ["scripts*", "shreni*"]

[tool.uv]
package = true
