[project]
name = "shreni"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anyio",
    "claude-agent-sdk",
    "arize-phoenix-otel",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.optional-dependencies]
phoenix-server = ["arize-phoenix"]

[project.scripts]
install-plugins = "scripts.install_plugins:main"
shreni = "shreni.sthapathi:cli"

[tool.setuptools.packages.find]
include = ["scripts*", "shreni*"]

[tool.uv]
package = true
